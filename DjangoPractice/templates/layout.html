
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Django Practice | Learn & Build{% endblock %}</title>

    <meta name="description"
          content="Practice Django, Python, HTML, CSS, and JavaScript.">

    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="{% static 'index.js' %}" defer></script>

    {% block extra_head %}{% endblock %}
</head>

<body>
    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">
            Django<span>Practice</span>
        </a>

        <button class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle navigation"
                aria-expanded="false">
            ☰
        </button>

        <nav class="nav-links" id="navLinks">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'code' %}">Code</a>
            <a href="{% url 'home' %}#practice">Practice</a>
            <a href="{% url 'home' %}#about">About</a>
            <a href="{% url 'home' %}#contact">Contact</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>
            © <span id="currentYear"></span> Django Practice Website.
            Built for learning.
        </p>
    </footer>
</body>
</html>
